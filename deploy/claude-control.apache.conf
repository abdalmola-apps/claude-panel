# Reverse-proxy claude-panel.localhost (primary) to Claude Control on
# 127.0.0.1:8787. Name-based vhost: only these Host names route here; every
# other site Apache serves is untouched. claude.localhost kept as an alias so
# the previous URL keeps working.
<VirtualHost *:80>
    ServerName  claude-panel.localhost
    ServerAlias claude.localhost claude-panel.local claude-panel

    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8787/
    ProxyPassReverse /  http://127.0.0.1:8787/

    ErrorLog  ${APACHE_LOG_DIR}/claude-control-error.log
    CustomLog ${APACHE_LOG_DIR}/claude-control-access.log combined
</VirtualHost>
